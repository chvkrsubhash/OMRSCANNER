{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="panel auth-panel"><div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p class="muted">Continue your exam practice.</p>
<form method="post" class="form">
<label>Username or email<input name="identity" required autocomplete="username" placeholder="Your username or email"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label>
<button class="button primary full" type="submit">Sign in</button>
</form><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>
{% endblock %}
